<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Hostel HQ Chat</title>
                <style>
                        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
                                #chatBox { background: #f0f0f0; padding: 15px; border-radius: 8px; min-height: 50px; margin-bottom: 15px; }
                                        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
                                                button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; }
                                                    </style>
                                                    </head>
                                                    <body>

                                                        <h2>Hostel HQ Assistant</h2>
                                                            <div id="chatBox">Welcome! Ask me a question.</div>
                                                                
                                                                    <input type="text" id="userInput" placeholder="Ask about dinner, rules, etc...">
                                                                        <button id="sendBtn">Send</button>

                                                                            <script>
                                                                                    document.getElementById("sendBtn").addEventListener("click", async () => {
                                                                                                const userText = document.getElementById("userInput").value;
                                                                                                            if (!userText) return;

                                                                                                                        const chatBox = document.getElementById("chatBox");
                                                                                                                                    chatBox.innerText = "Thinking...";

                                                                                                                                                try {
                                                                                                                                                                const response = await fetch('https://hostel-hq-rag.onrender.com/api/chat', {
                                                                                                                                                                                    method: 'POST',
                                                                                                                                                                                                        headers: { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                            body: JSON.stringify({ message: userText })
                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                            const data = await response.json();
                                                                                                                                                                                                                                                                            chatBox.innerText = data.answer; 
                                                                                                                                                                                                                                                                                        } catch (error) {
                                                                                                                                                                                                                                                                                                        chatBox.innerText = "Error connecting to server.";
                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                </html>
